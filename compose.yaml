services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: terminus
      POSTGRES_USER: terminus
      POSTGRES_PASSWORD: terminus
    ports:
      - "5432:5432"
    volumes:
      - terminus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terminus"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: ["/app/server/bin/server"]
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/terminus
      DATABASE_USER: terminus
      DATABASE_PASSWORD: terminus
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["/app/worker/bin/worker"]
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/terminus
      DATABASE_USER: terminus
      DATABASE_PASSWORD: terminus
      MARTA_API_KEY: ${MARTA_API_KEY:-replace-me}
      FIREBASE_SERVICE_ACCOUNT_JSON: /run/secrets/firebase.json
    volumes:
      - ./firebase-service-account.json:/run/secrets/firebase.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  terminus-postgres:
